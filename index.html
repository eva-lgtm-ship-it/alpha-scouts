<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alpha Scouts · The Independence Expedition</title>
<meta name="description" content="Alpha Scouts: The Independence Expedition — session-by-session workshop site for Alpha East Bay.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700&display=swap" rel="stylesheet">
<style id="appcss">
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#E9DCC0; --paper-2:#F3EADA; --pine:#16382B; --pine-2:#1E4C3A;
  --moss:#3E7D4E; --blaze:#E4572E; --sky:#2F6F9E; --ink:#14231C;
  --rule:#C6B48D; --shadow:0 3px 0 var(--pine);
  --disp:'Baloo 2',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{height:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
/* kraft texture: faint contour lines, drawn not imaged */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.055;
  background-image:repeating-linear-gradient(58deg,var(--pine) 0 1px,transparent 1px 46px),
                   repeating-linear-gradient(-32deg,var(--pine) 0 1px,transparent 1px 62px)}
a{color:var(--sky)}
:focus-visible{outline:3px solid var(--blaze);outline-offset:3px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;position:relative;z-index:1}
.side{width:290px;flex:0 0 290px;background:var(--pine);color:#EFE6D2;
  padding:18px 0 40px;overflow-y:auto;max-height:100vh;position:sticky;top:0;
  margin-left:0;transition:margin-left .22s ease}
body.navclosed .side{margin-left:-290px}
.navclose{position:absolute;top:14px;right:12px;background:#2A5744;color:#EFE6D2;border:0;
  border-radius:7px;width:30px;height:30px;font-size:17px;cursor:pointer;line-height:1}
.scrim{display:none;position:fixed;inset:0;background:rgba(11,28,21,.5);z-index:55}
body.navopen .scrim{display:block}
.brand{padding:0 46px 14px 18px;border-bottom:2px solid #2A5744;margin-bottom:12px;position:relative}
.brand h1{font-family:var(--disp);font-size:23px;line-height:1.1;color:#fff}
.brand p{font-size:12.5px;color:#9FC0AC;margin-top:3px}
.grp{margin:14px 0 6px;padding:0 18px;font-family:var(--disp);font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:#79A98D}
.nav a{display:flex;gap:9px;align-items:baseline;padding:7px 18px 7px 16px;
  color:#E4DBC6;text-decoration:none;font-size:15px;border-left:5px solid transparent}
.nav a:hover{background:#1E4C3A}
.nav a.on{background:#22553F;border-left-color:var(--blaze);color:#fff;font-weight:700}
.nav a .num{font-family:var(--mono);font-size:11.5px;color:#7FA98F;flex:0 0 34px}
.nav a.on .num{color:var(--paper)}
.vpick{margin:18px 14px 0;padding:12px;background:#1E4C3A;border-radius:9px}
.vpick label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#9FC0AC;margin-bottom:6px;font-family:var(--disp)}
.vpick select{width:100%;padding:7px;border-radius:6px;border:2px solid #2F6B52;
  background:#123326;color:#EFE6D2;font-family:var(--body);font-size:13.5px}
.vpick button{margin-top:8px;width:100%;padding:7px;border-radius:6px;border:0;
  background:var(--blaze);color:#fff;font-family:var(--disp);font-size:14px;cursor:pointer}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:11px 26px;
  border-bottom:3px solid var(--pine);background:var(--paper-2);position:sticky;top:0;z-index:20}
.btn{font-family:var(--disp);font-size:14px;padding:7px 14px;border-radius:8px;
  border:3px solid var(--pine);background:#fff;color:var(--pine);cursor:pointer;box-shadow:0 2px 0 var(--pine)}
.btn:hover{background:var(--paper-2)}
.btn.pri{background:var(--blaze);color:#fff;border-color:var(--pine)}
.btn:active{transform:translateY(2px);box-shadow:none}
.burger{display:inline-block}
.page{padding:30px 34px 90px;max-width:1000px;width:100%;margin:0 auto;flex:1}
.kicker{font-family:var(--disp);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--moss);margin-bottom:5px}
h2.title{font-family:var(--disp);font-size:clamp(30px,4.4vw,46px);line-height:1.06;color:var(--pine)}
.when{font-family:var(--mono);font-size:13px;color:#6C7C71;margin-top:5px}
.lead{font-size:20px;margin:16px 0 22px;max-width:64ch}

/* ---------- trail blaze: the signature ---------- */
.blazebar{display:flex;align-items:center;gap:3px;padding:9px 26px;background:var(--pine);overflow-x:auto}
.bz{width:12px;height:20px;border-radius:2px;background:#2F6B52;flex:0 0 auto}
.bz.done{background:#5E9E77}
.bz.now{background:var(--blaze);box-shadow:0 0 0 3px rgba(228,87,46,.3)}
.bz.mile{width:16px;height:28px;background:#E9DCC0}
.bz.mile.done{background:var(--blaze)}
.blazebar .lab{font-family:var(--mono);font-size:11px;color:#9FC0AC;margin-left:10px;white-space:nowrap}

/* ---------- cards ---------- */
.card{background:#fff;border:3px solid var(--pine);border-radius:13px;
  box-shadow:var(--shadow);padding:20px 22px;margin:18px 0}
.card>h3{font-family:var(--disp);font-size:24px;color:var(--pine);line-height:1.15}
.blockhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.mins{font-family:var(--mono);font-size:13px;font-weight:700;background:var(--pine);color:var(--paper);
  padding:4px 10px;border-radius:20px;white-space:nowrap}
.steps{list-style:none;margin-top:14px}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:2px dashed var(--rule)}
.steps li:first-child{border-top:0}
.ic{font-size:27px;line-height:1;flex:0 0 34px;text-align:center}
.stxt{flex:1;font-size:17.5px}
.hear{flex:0 0 auto;border:2px solid var(--pine);background:var(--paper-2);border-radius:20px;
  font-family:var(--disp);font-size:13px;padding:4px 11px;cursor:pointer;color:var(--pine);white-space:nowrap}
.hear:hover{background:var(--blaze);color:#fff}
.hear.playing{background:var(--blaze);color:#fff}
.hear.big{font-size:14px;padding:6px 14px}

/* ---------- plan ---------- */
.ican{background:var(--moss);color:#fff;border:3px solid var(--pine);border-radius:13px;
  padding:18px 22px;margin:20px 0;box-shadow:var(--shadow)}
.ican .lb{font-family:var(--disp);font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.ican p{font-size:22px;font-family:var(--disp);line-height:1.25;margin-top:4px}
.planrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:2px dashed var(--rule)}
.planrow:first-of-type{border-top:0}
.planrow .nm{flex:1;font-family:var(--disp);font-size:18px;color:var(--pine)}
.total{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
  padding-top:12px;border-top:3px solid var(--pine);font-family:var(--disp);font-size:19px}
.expect{border-left:8px solid var(--blaze);background:#FFF3EC;border-radius:0 10px 10px 0;
  padding:14px 18px;margin:16px 0;font-size:17px}
.flag{display:inline-block;font-family:var(--disp);font-size:13px;letter-spacing:.1em;
  background:var(--blaze);color:#fff;padding:4px 12px;border-radius:20px;margin-bottom:8px}
.flag.grey{background:var(--moss)}

/* ---------- misc blocks ---------- */
.call{border:3px solid var(--pine);border-radius:13px;padding:18px 22px;margin:18px 0;box-shadow:var(--shadow)}
.call.blaze{background:#FFF3EC;border-color:var(--blaze)}
.call.pine{background:#EAF3ED}
.call h4{font-family:var(--disp);font-size:21px;color:var(--pine);margin-bottom:6px}
.call p{margin-top:7px;font-size:17px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));margin:18px 0}
.gi{background:#fff;border:3px solid var(--pine);border-radius:13px;padding:16px;box-shadow:var(--shadow)}
.gi .gh{font-family:var(--disp);font-size:18px;color:var(--pine);display:flex;gap:9px;align-items:center}
.gi p{font-size:15.5px;margin-top:7px}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr;margin:18px 0}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.two>div{border:3px solid var(--pine);border-radius:13px;padding:16px;background:#fff;box-shadow:var(--shadow)}
.two h4{font-family:var(--disp);font-size:19px;margin-bottom:9px;display:flex;gap:8px;align-items:center}
.two ul{list-style:none}
.two li{padding:6px 0;border-top:2px dashed var(--rule);font-size:16px}
.two li:first-child{border-top:0}
.mv{display:flex;gap:16px;align-items:flex-start;background:#fff;border:3px solid var(--pine);
  border-radius:13px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.mv .n{font-family:var(--disp);font-size:34px;width:56px;height:56px;flex:0 0 56px;border-radius:50%;
  background:var(--sky);color:#fff;display:grid;place-items:center}
.mv h4{font-family:var(--disp);font-size:22px;color:var(--pine)}
.cnt{display:flex;gap:14px;align-items:center;border:3px solid;border-radius:13px;padding:15px 18px;margin:12px 0;box-shadow:var(--shadow)}
.cnt.yes{background:#EAF6EE;border-color:var(--moss)}
.cnt.no{background:#FCEDEA;border-color:var(--blaze)}
.cnt .m{font-size:30px}
.cnt .t{flex:1;font-family:var(--disp);font-size:19px;color:var(--pine)}
.cnt .v{font-family:var(--disp);font-size:13px;letter-spacing:.08em;padding:4px 11px;border-radius:20px;color:#fff}
.cnt.yes .v{background:var(--moss)}.cnt.no .v{background:var(--blaze)}

/* ladder = trail blazes climbing */
.ladder{display:flex;flex-direction:column;gap:0;margin:20px 0}
.rung{display:flex;gap:18px;align-items:stretch}
.rail{flex:0 0 54px;display:flex;flex-direction:column;align-items:center}
.rail .mark{width:28px;height:44px;border-radius:4px;background:var(--paper-2);
  border:3px solid var(--pine);display:grid;place-items:center;font-family:var(--disp);font-size:15px}
.rail .line{flex:1;width:6px;background:var(--pine);min-height:16px}
.rung:last-child .line{background:transparent}
.rung.top .mark{background:var(--blaze);color:#fff}
.rbody{flex:1;background:#fff;border:3px solid var(--pine);border-radius:13px;
  padding:14px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.rbody h4{font-family:var(--disp);font-size:21px;color:var(--pine)}
.rbody .w{font-family:var(--mono);font-size:12.5px;color:var(--moss)}
.rbody p{font-size:16px;margin-top:5px}

/* chain */
.chain{counter-reset:c;margin:18px 0}
.stop{display:flex;gap:16px;align-items:flex-start;background:#fff;border:3px solid var(--pine);
  border-radius:13px;padding:15px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.stop .sn{font-family:var(--disp);font-size:23px;width:46px;height:46px;flex:0 0 46px;border-radius:50%;
  background:var(--pine);color:var(--paper);display:grid;place-items:center}
.stop h4{font-family:var(--disp);font-size:20px;color:var(--pine)}
.stop .pr{margin-top:5px;font-size:16px}
.stop .pr b{color:var(--blaze)}
.stop .meta{font-family:var(--mono);font-size:12.5px;color:#6C7C71;margin-top:4px}

/* qa */
.qa{border-left:8px solid var(--moss);background:#fff;border-radius:0 10px 10px 0;padding:14px 18px;
  margin:12px 0;border-top:3px solid var(--pine);border-right:3px solid var(--pine);border-bottom:3px solid var(--pine)}
.qa .s{font-family:var(--mono);font-size:12px;color:var(--moss)}
.qa .q{font-family:var(--disp);font-size:19px;color:var(--pine);margin:3px 0 7px}
.qa .t{font-size:16px;padding-left:16px;border-left:3px dashed var(--rule)}
.qa .t:before{content:"then: ";font-family:var(--mono);font-size:12px;color:var(--moss)}

/* printables index */
.plist{display:grid;gap:14px;margin:18px 0}
.pitem{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--pine);
  border-radius:13px;padding:15px 18px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.pitem:hover{background:var(--paper-2)}
.pitem .pn{flex:1}
.pitem h4{font-family:var(--disp);font-size:19px;color:var(--pine)}
.pitem p{font-size:15px;margin-top:3px}
.pitem .wh{font-family:var(--mono);font-size:12px;color:var(--moss);white-space:nowrap}

/* sheet */
.sheet{background:#fff;border:3px solid var(--pine);border-radius:6px;padding:26px;margin:18px 0}
.sheet h3{font-family:var(--disp);font-size:27px;color:var(--pine)}
.sheet .sub{font-size:15px;color:#4A5A50;margin-top:3px;margin-bottom:16px}
.frow{display:flex;align-items:baseline;gap:9px;margin:9px 0}
.frow .fl{font-family:var(--disp);font-size:15px;color:var(--pine);white-space:nowrap}
.frow .fr{flex:1;border-bottom:2px solid var(--pine);min-width:40px;height:20px}
table.sh{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
table.sh th{background:var(--pine);color:var(--paper);font-family:var(--disp);font-weight:600;
  padding:7px 8px;text-align:left;border:1.5px solid var(--pine);font-size:13.5px}
table.sh td{border:1.5px solid var(--pine);padding:9px 8px;height:30px;vertical-align:top}
table.sh td.tick{width:34px;text-align:center}
ul.bl{list-style:none;margin:12px 0}
ul.bl li{display:flex;gap:10px;padding:6px 0;font-size:15px;align-items:baseline}
ul.bl li:before{content:"■";color:var(--blaze);flex:0 0 auto;font-size:12px}
ul.ck{list-style:none;margin:12px 0}
ul.ck li{display:flex;gap:11px;padding:8px 0;border-top:1.5px dashed var(--rule);font-size:15px;align-items:flex-start}
ul.ck li:before{content:"";flex:0 0 20px;height:20px;border:2.5px solid var(--pine);border-radius:3px;margin-top:1px}
.cards2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:720px){.cards2{grid-template-columns:1fr}}
.pcard{border:2.5px dashed var(--pine);border-radius:8px;padding:13px}
.pcard h5{font-family:var(--disp);font-size:17px;color:var(--pine)}
.pcard p{font-size:14px;margin-top:4px}
.pcard .win{font-size:13.5px;margin-top:6px;color:var(--moss)}
.bigrow{display:flex;gap:14px;align-items:flex-start;border:2.5px solid var(--pine);border-radius:8px;
  padding:13px;margin:10px 0}
.bigrow .bn{font-family:var(--disp);font-size:26px;width:48px;height:48px;flex:0 0 48px;border-radius:8px;
  background:var(--pine);color:var(--paper);display:grid;place-items:center}
.bigrow h5{font-family:var(--disp);font-size:19px;color:var(--pine)}
.bigrow p{font-size:15px;margin-top:3px}
.para p{margin:10px 0;font-size:15.5px}
.photomap{margin:14px 0;border:2.5px solid var(--pine);border-radius:8px;overflow:hidden;background:#F3EADA;page-break-inside:avoid}
.pmwrap{position:relative;line-height:0}
.pmwrap img{display:block;width:100%;height:auto}
/* zero-size anchor: the DOT sits exactly on the coordinate, the label hangs off it */
.pin{position:absolute;width:0;height:0;line-height:1}
.pin b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;
  background:var(--blaze);color:#fff;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);
  display:grid;place-items:center;font-family:var(--disp);font-size:15px}
.pin.start b{background:var(--pine)}
.pin i{position:absolute;left:19px;top:-9px;white-space:nowrap;font-style:normal;font-family:var(--disp);
  font-size:11.5px;color:#14231C;background:rgba(255,255,255,.92);border:1.5px solid var(--pine);
  border-radius:4px;padding:1px 6px}
.pin.lft i{left:auto;right:19px}
.pin.dn i{left:50%;top:20px;transform:translateX(-50%)}
.photomap figcaption{font-size:11.5px;padding:6px 9px;background:var(--pine);color:var(--paper);font-family:var(--mono)}
@media(max-width:640px){.pin i{display:none}}
.mapgrid{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin:14px 0}
@media(max-width:760px){.mapgrid{grid-template-columns:1fr}}
.gm{border:2.5px solid var(--pine);border-radius:8px;overflow:hidden;background:#F3EADA;page-break-inside:avoid}
.gm img{display:block;width:100%;height:auto}
.gm figcaption{font-size:11.5px;padding:6px 9px;background:var(--pine);color:var(--paper);font-family:var(--mono)}
.keynote{border:2.5px dashed var(--blaze);background:#FFF3EC;border-radius:8px;padding:12px 14px;
  margin:14px 0;font-size:14.5px}
.keynote code{font-family:var(--mono);font-size:13px;background:#fff;padding:1px 5px;border-radius:4px}
.lmkphotoimg{width:208px;height:156px;object-fit:cover;border:2px solid var(--pine);border-radius:6px;display:block}
.mapwrap{margin:14px 0;border:2.5px solid var(--pine);border-radius:8px;overflow:hidden;background:#F3EADA}
.mapsvg{display:block;width:100%;height:auto}
.lmks{display:grid;gap:12px;margin:14px 0}
.lmkcard{display:flex;gap:14px;border:2.5px dashed var(--pine);border-radius:9px;padding:12px;page-break-inside:avoid}
.lmkimg{position:relative;flex:0 0 208px}
.lmkimg .lmk{width:208px;height:156px;border:2px solid var(--pine);border-radius:6px;background:#F3EADA;display:block}
.lmkno{position:absolute;top:-9px;left:-9px;width:27px;height:27px;border-radius:50%;background:var(--blaze);
  color:#fff;font-family:var(--disp);font-size:15px;display:grid;place-items:center;border:2px solid #fff}
.lmkbody{flex:1}
.lmkbody h5{font-family:var(--disp);font-size:18px;color:var(--pine)}
.lmkmeta{font-family:var(--mono);font-size:11.5px;color:#6C7C71}
.lmkwalk{font-family:var(--disp);font-size:13px;color:var(--blaze);margin:2px 0 5px}
.lmkbody p{font-size:14px;margin-top:4px}
.lmklook{color:#3E4E44}
.lmkphoto{margin-top:8px;border:2px dashed var(--rule);border-radius:6px;height:34px;
  display:grid;place-items:center;font-size:11.5px;color:#96876A;font-style:italic}
.foot{margin-top:16px;padding-top:12px;border-top:2.5px solid var(--pine);font-size:14px;color:#3E4E44}
.stampbox{display:flex;gap:16px;margin-top:18px}
.stampbox div{flex:1;border:3px solid var(--pine);border-radius:8px;height:78px;
  display:grid;place-items:center;font-family:var(--disp);font-size:21px;color:var(--pine)}

/* voices */
.vtab{width:100%;border-collapse:collapse;margin:14px 0}
.vtab th{background:var(--pine);color:var(--paper);font-family:var(--disp);padding:8px 10px;text-align:left}
.vtab td{border:2px solid var(--rule);padding:10px;font-size:15.5px;vertical-align:top}
.vtab td:first-child{font-family:var(--disp);color:var(--pine);white-space:nowrap;width:130px}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px;
  border-top:3px solid var(--pine);padding-top:18px}

/* present mode */
body.present .side{display:none}
body.present .page{max-width:1500px;padding:36px 60px 80px}
body.present{font-size:22px}
body.present h2.title{font-size:clamp(40px,5.6vw,68px)}
body.present .stxt{font-size:25px}
body.present .ic{font-size:36px;flex-basis:46px}
body.present .ican p{font-size:32px}

@media(max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;margin-left:0;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:6px 0 22px rgba(0,0,0,.34)}
  body.navopen .side{transform:none}
  body.navclosed .side{margin-left:0}
  .page{padding:22px 17px 80px}
}
@media(min-width:901px){ .scrim{display:none!important} }
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media print{
  .side,.topbar,.blazebar,.pager,.hear,.btn{display:none!important}
  body{background:#fff}
  body::before{display:none}
  .sheet{border:0;padding:0;margin:0}
  .card,.gi,.call{box-shadow:none}
}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand">
      <button class="navclose" id="navclose" type="button" aria-label="Hide menu">&times;</button>
      <h1>Alpha Scouts</h1>

orker - somebody who does not work at Alpha - reads your sheet at the Sash Ceremony and stamps it PASS or NOT YET.", "They look at the walk. Never at you."]}]}, {"id": "test-after", "kicker": "The Big Test", "title": "After The Test", "blocks": [{"t": "lead", "text": "There are two endings. One of them is not failing."}, {"t": "two", "left": {"h": "PASS", "i": "🏅", "items": ["You get the Alpha Explorer patch at the Sash Ceremony.", "You tell your family the hardest moment you solved yourself.", "Your Week 1 number goes up on the wall next to your Week 8 number."]}, "right": {"h": "NOT YET", "i": "📅", "items": ["NOT YET is a DATE, not a verdict.", "You get told the ONE thing to fix - and only that one thing.", "You get a new sealed mission within two weeks.", "The bar is exactly the same. It never gets easier.", "You keep every patch you already earned."]}}, {"t": "call", "style": "blaze", "title": "Some things never count against you", "lines": ["A Safety Stop. A shop that shut early. Rain. Bad luck. None of these are your fault and none of them fail you - you run that part again."]}]}], "guide": [{"id": "g-questions", "kicker": "Guide Corner", "title": "Guiding Questions", "blocks": [{"t": "lead", "text": "One question per session, each paired with the line that moves the room on."}, {"t": "qa"}]}, {"id": "g-sideways", "kicker": "Guide Corner", "title": "When It Goes Sideways", "blocks": [{"t": "lead", "text": "Universal moves. Use these instead of inventing something in the moment."}, {"t": "grid", "items": [{"i": "🥶", "h": "A scout freezes at a corner", "p": "Say nothing. Count to thirty in your head. Freezing is data, and most scouts move on their own. If they are still stuck, the LEAD GUIDE - never the shadow - resets them to the last known point and logs it as an assist."}, {"i": "😢", "h": "A scout is upset, not stuck", "p": "Distress is not a scoring event. Close the distance, sit with them, stop the clock. A child in tears is never being assessed."}, {"i": "🗣️", "h": "One scout answers for everyone", "p": "Log the assist against the scouts who received it, not against the one being kind. Then reframe it out loud: the kindest thing you can do is let your patrol-mate have their own win."}, {"i": "🤐", "h": "A shadow keeps coaching", "p": "Reassign them, do not coach them mid-mission. Note the broken protocol honestly and re-run that leg."}, {"i": "⏰", "h": "The clock is going to beat you", "p": "Shorten YOUR blocks - the brief, the debrief - never the scout's mission. If a queue eats the clock through no fault of theirs, that is a guide error and the deadline axis is read with that noted."}, {"i": "🌧️", "h": "Weather or a closed venue", "p": "Move to the indoor backup with the same decision-point structure. Never cancel the rep. A Safety Stop or a closed shop never fails a scout."}, {"i": "🙋", "h": "A scout will not ask a helper", "p": "Do not ask for them. Back up to the Week 4 script and rehearse it again on the spot: hello, one question, thank you."}, {"i": "📉", "h": "A scout is behind at a checkpoint", "p": "Match the coaching to the gap. Freezes: model a think-aloud. Only recovers with hints: fade the hints. Fine until the twist: more trouble cards."}]}]}, {"id": "g-reading", "kicker": "Guide Corner", "title": "Reading Support", "blocks": [{"t": "lead", "text": "Two of four scouts need reading support. This site is built so they never wait for an adult."}, {"t": "call", "style": "blaze", "title": "Do not read aloud what a scout could tap", "lines": ["Every block and every single step has its own Hear it button. Point at the button, not at the words.", "Reading it for them is the same shape of mistake as telling them the way. The independence is the point."]}, {"t": "grid", "items": [{"i": "🔊", "h": "Every step has its own button", "p": "A scout can replay step 4 without sitting through steps 1 to 3. Show them that once, in Session 1, and they will use it all season."}, {"i": "🖼️", "h": "Every step has a picture", "p": "A scout who cannot read the line can still tell a bus from a receipt from a leaf. Ask them what the picture shows before you offer any words."}, {"i": "🎚️", "h": "Pick the voice first", "p": "Use the voice picker in the sidebar before the session starts. The default voice on most devices is the worst one installed."}, {"i": "🗣️", "h": "On paper, pair up", "p": "Printables have no audio. Pair a reading-support scout with a partner for sheets - but never on a scored leg, where that becomes a peer assist."}]}, {"t": "voices"}]}], "printables": [{"id": "p-parent", "name": "Parent Briefing Note", "use": "Hand out in Week 0, before permission slips.", "when": "Week 0", "sheet": {"title": "FOR FAMILIES", "sub": "Alpha Scouts: The Independence Expedition", "para": ["Over 8 weeks your child learns to navigate the real world without being rescued. They plan routes on paper, find a book by its call number, ride a public bus with their own fare card, complete a real errand on a deadline, and ask a real community adult for information - all with a trained adult walking beside them who is not permitted to help.", "We measure one thing: how often your child needs an adult to solve a problem for them. In Week 1 we record their starting number. By Week 8 the bar is zero. Your child is only ever compared with their own first number, never with another child.", "In Week 8 they open a sealed mission they have never seen and walk a 60-minute chain across the UC Berkeley campus, collecting real proof at every stop. A chartered coach takes them there and brings them home.", "Two things we want you to hear from us first. Your child will ride public transit alone on a scored segment in Week 6, after two rehearsals. And as the season goes on, patrols shrink until each child walks as their own one-person patrol, with their own adult in continuous sight."], "bullets": ["Every route is walked by a guide before your child walks it.", "Crossings are at lights or marked crossings only.", "Adults carry a phone and your child's medical information at all times.", "A Safety Stop - an adult stepping in - never counts against your child."], "foot": "Questions before you sign anything? Ask the lead guide. We would rather talk it through than have you read it on a form."}, "order": 0, "sub": 5}, {"id": "p-patrolboard", "name": "Patrol & Shadow Board", "use": "Tracks the patrol ladder from 2 patrols of 2 down to 4 patrols of 1.", "when": "Week 0 onward", "sheet": {"title": "PATROL & SHADOW BOARD", "sub": "Patrol structure is a dial, not a setting. Promote on readiness, never on the calendar.", "table": {"cols": ["Week", "Structure", "Scout", "Patrol", "Shadow adult", "Through the gate?"], "rows": 10, "data": [["Wks 1-4", "2 patrols of 2", "", "", "", ""], ["Wks 5-6", "1 patrol of 2 + 2 solo", "", "", "", ""], ["Wks 7-8", "4 patrols of 1", "", "", "", ""]]}, "bullets": ["GATE TO GO SOLO (Wks 5-6): one unscored solo stretch done, at least 1 Self-Recovery logged, last expedition finished with 1 or fewer adult assists, AND the family told in a conversation.", "GATE TO STAY SOLO (Wks 7-8): met the CP2 bar at S12 and a clean dress rehearsal at S14.", "NEVER demote a scout who has been promoted. If a solo week goes badly, add coaching, not a patrol-mate.", "NEVER run a patrol of one by accident: if a scout is absent, merge the rest into one patrol that day."], "foot": "Solo patrols need 1:1 adults EVERY day. Confirm five adults before you promote anyone."}, "order": 0, "sub": 5}, {"id": "p-week0", "name": "Week 0 Setup Checklist", "use": "For the lead guide. Order by lead time.", "when": "Before S1", "sheet": {"title": "WEEK 0 CHECKLIST", "sub": "Ordered by lead time. The first three sink the workshop if they slip.", "checks": ["4+ wks - Apply for a Youth Clipper card for all 4 scouts (guardian application per child).", "4+ wks - Recruit and confirm FOUR trained shadows. Solo patrols need 1:1.", "3-6 months - Book the Week 8 charter coach. Confirm the pick-up curb.", "4+ wks - Order the Alpha Store patch sets and the custom Alpha Explorer run.", "3 wks - Name the outside evaluator (librarian or visitor-centre staff).", "3 wks - Design the proof list, then pre-walk and personally collect every proof yourself.", "2 wks - WALK EVERY ROUTE. Pre-ride Line 18. Controlled crossings only.", "2 wks - Design the four solo-stretch loops, two per hold point.", "2 wks - Hold the parent conversation about solo transit and solo patrols.", "2 wks - Notify UC Berkeley Visitor Services about the Week 8 group.", "2 wks - Field-trip permissions covering transit, every route, and Berkeley. Collect medical lists.", "1 wk - Train shadows on the Silent Shadow Protocol and the Assist Log.", "1 wk - Print maps (5 terrains + redacted variants), journals, route keys, Assist Logs.", "1 wk - Set the Week 8 rain date."]}, "order": 0, "sub": 5}, {"id": "map-1", "name": "Map - Session 1: Our own blocks", "order": 1, "sub": 1, "use": "The map for Session 1. Where we are. School is on Park Boulevard, and Downtown Piedmont is over to the west.", "when": "S1", "sheet": {"title": "SESSION 1 MAP - OUR OWN BLOCKS", "sub": "Where we are. School is on Park Boulevard, and Downtown Piedmont is over to the west.", "gmap": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=roadmap&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&visible=37.818562,-122.210934%7C37.818770,-122.210143", "gbird": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=hybrid&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&visible=37.818562,-122.210934%7C37.818770,-122.210143", "svg": "<svg viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"mapsvg\"><rect width=\"640\" height=\"400\" fill=\"#F3EADA\" stroke=\"#16382B\" stroke-width=\"3\" rx=\"8\"/><line x1=\"148\" y1=\"50\" x2=\"148\" y2=\"350\" stroke=\" re you go home."], "foot": "This block runs 30 min. Nothing here is scored."}}, {"id": "p-journal", "name": "Scout Journal", "order": 1, "sub": 3, "use": "One per scout for the whole workshop. The prompts below match the printed 20-page booklet.", "when": "S1 onward", "sheet": {"title": "SCOUT JOURNAL", "sub": "One booklet per scout. Every page is written by the scout, never by an adult.", "fields": [["My name", ""], ["My patrol changes - it is not written here", ""]], "table": {"cols": ["Page", "What the scout writes", "Prompts on that page"], "rows": 0, "data": [["Cover", "My name: ______________________", "16 sessions. 8 weeks. 1 secret test. / The grown-ups are right here. They are NOT allowed to help me."], ["S1 - My 3 Moves", "When I am stuck I do these, in order.", "1. STOP and LOOK - my map, the signs, what I can see. / 2. PICK ONE and TRY - think of 2 ways, choose one, go. / 3. ASK A HELPER - never my shadow grown-up."], ["S2 - Know My Ground", "Draw my route. Put an X on every corner where I had to choose.", "The hardest part was... / THE BIG QUESTION: when did I want a grown-up to fix it, but I fixed it myself?"], ["S3 - GPS Challenge", "Directions from school to the library. No phone. No map.", "15 or more numbered steps. / Start every step with a doing word."], ["S4 - Library Day", "My topic / my book's number / my book's name.", "How did I find it on the shelf? / THE BIG QUESTION."], ["S5 - When It Goes Wrong", "One problem I solved at the table today.", "Tomorrow, the FIRST thing I will try is..."], ["S6 - The Twist", "What went wrong? What did I try FIRST?", "Did I finish anyway? / THE BIG QUESTION."], ["S7 - Ask the Right Grown-Up", "My question for tomorrow. Who will I ask?", "Hello - one question - thank you."], ["S8 - The Question Hunt", "I asked ____. I said ____. I found out ____.", "THE BIG QUESTION."], ["S9 - Money, Bus & Clock", "I have __ minutes. Walking back takes __. So I leave at __.", "If I miss my stop I will... / Tomorrow I walk alone. I will tell myself:"], ["S10 - Practice Run", "What did walking alone feel like?", "What I said to myself out there."], ["S11 - My Numbers", "Last time a grown-up helped me ____ times.", "Where did I take help? / My goal for tomorrow."], ["S12 - The Real Errand", "My errand / my proof / minutes to spare.", "The hardest thing I decided all by myself. / THE BIG QUESTION."], ["S13 - The Chain", "Draw the chain. Number each stop and its proof.", "The part I am leading. / The handover: 'My part is done.' 'My part starts here.'"], ["S14 - The Long Way", "My stops and my proofs. Today's secret word: ______", "What went wrong and how I fixed it. / ONE thing I will do differently."], ["S15 - Tomorrow Is The Big One", "In Week 1 the hard part was ____. Now the hard part is ____.", "My start-line sentence."], ["S16 - The Big Test", "Proof log: 6 stops. Secret word on every page.", "The hardest moment and how I solved it MYSELF. / In Week 1 I needed a grown-up for ____. Now I can ____."], ["My Record", "Assists after every mission: Wk1 __ Wk2 __ Wk3 __ Wk4 __ Wk5 __ Wk6 __ Wk7 __ Wk8 __", "My sash: Cadet, Scout, Pathfinder, Trailblazer, Alpha Explorer."]]}, "bullets": ["Print double-sided and fold: 20 pages is 5 folded sheets, saddle-stitched.", "The Big Question is on EVERY mission page, word for word: 'When did you want a grown-up to fix it, but you fixed it YOURSELF?'", "Page 5 (Week 1) is read again in Week 8 - that comparison in the scout's own handwriting is the whole workshop.", "Writing lines are handwriting rules: solid baseline with a dotted midline, 32pt apart."], "foot": "The full illustrated 20-page booklet is a separate print-ready PDF. This sheet is the content map for reprinting or adapting it."}}, {"id": "p-moves", "name": "My 3 Moves Poster", "use": "Laminate and post on the classroom wall. Also a pocket card.", "when": "S1 onward", "sheet": {"title": "MY 3 MOVES", "sub": "When I am stuck.", "big": [["1", "STOP and LOOK", "My map. The signs. What I can see."], ["2", "PICK ONE and TRY", "Think of 2 ways. Choose one. Go."], ["3", "ASK A HELPER", "Never my shadow grown-up."]], "foot": "Up the hill = toward the hills.  Down the hill = toward the water."}, "order": 1, "sub": 5}, {"id": "p-ladder", "name": "Patch Ladder Wall Chart", "use": "Post on the wall in Session 1. Tick as scouts earn.", "when": "S1 onward", "sheet": {"title": "THE PATCH LADDER", "sub": "Rank never runs ahead of skill.", "table": {"cols": ["Patch", "Earned at", "What you had to do", "Scout 1", "Scout 2", "Scout 3", "Scout 4"], "rows": 0, "data": [["CADET", "S2 / Wk1", "Finished the first mission. Starting number recorded.", "", "", "", ""], ["SCOUT", "S4 / Wk2", "Own route + GPS Challenge passed + right book in hand.", "", "", "", ""], ["PATHFINDER", "S6 / Wk3", "Fixed a problem myself. 2 or fewer adult helps.", "", "", "", ""], ["TRAILBLAZER", "S12 / Wk6", "Real errand, no help at all, one helper question, all proof, on time.", "", "", "", ""], ["ALPHA EXPLORER", "S16 / Wk8", "Passed the Big Test. Cannot be bought.", "", "", "", ""]]}, "foot": "Ticks go on when the bar is MET, never on a date. A patch that arrives late was never earned in front of anyone."}, "order": 1, "sub": 5}, {"id": "p-kit", "name": "Scout Kit Checklist", "use": "Tick every scout's kit before Session 1 and again before each expedition.", "when": "S1 onward", "sheet": {"title": "SCOUT KIT CHECKLIST", "sub": "One kit per scout. Check it before every mission, not just the first.", "fields": [["Scout", ""], ["Checked by", ""], ["Date", ""]], "checks": ["Paper map for today's terrain (plus the redacted variant if the mission uses Obstacle Card 3)", "Baseplate compass", "Scout Journal", "Proof Pack booklet", "Pencil (2B, so it will take a rubbing)", "Disposable camera", "Patch sash", "Youth Clipper card - in this scout's own name", "Zip specimen bag (missions that collect a natural proof)", "Glue stick", "Mission money in small bills, under $10 (errand missions only)"], "foot": "Adults also carry: Assist Log + route key, Silent Shadow card, charged phone, the allergy and medical list, reserve-route card, and exact-change backup fare."}, "order": 1, "sub": 5}, {"id": "map-2", "name": "Map - Session 2: The landmark loop", "order": 2, "sub": 1, "use": "The map for Session 2. All five landmarks are on today's loop: about 1.4 miles, roughly 55 minutes of walking. The numbers sit on the saved markers in the campus map.", "when": "S2", "sheet": {"title": "SESSION 2 MAP - THE LANDMARK LOOP", "sub": "All five landmarks are on today's loop: about 1.4 miles, roughly 55 minutes of walking. The numbers sit on the saved markers in the campus map.", "gmap": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=roadmap&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&markers=color:0xE4572E%7Clabel:3%7C37.817523,-122.205595&markers=color:0xE4572E%7Clabel:4%7C37.813478,-122.211887&markers=color:0xE4572E%7Clabel:5%7C37.812222,-122.213611&markers=color:0xE4572E%7Clabel:6%7C37.813027,-122.214814&visible=37.818562,-122.210934%7C37.818770,-122.210143%7C37.817523,-122.205595%7C37.813478,-122.211887%7C37.812222,-122.213611%7C37.813027,-122.214814", "gbird": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=hybrid&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&markers=color:0xE4572E%7Clabel:3%7C37.817523,-122.205595&markers=color:0xE4572E%7Clabel:4%7C37.813478,-122.211887&markers=color:0xE4572E%7Clabel:5%7C37.812222,-122.213611&markers=color:0xE4572E%7Clabel:6%7C37.813027,-122.214814&visible=37.818562,-122.210934%7C37.818770,-122.210143%7C37.817523,-122.205595%7C37.813478,-122.211887%7C37.812222,-122.213611%7C37.813027,-122.214814", "svg": "<svg viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"mapsvg\"><rect width=\"640\" height=\"400\" fill=\"#F3EADA\" stroke=\"#16382B\" , "label": "Corpus Christi Church", "side": "left"}]}}}, {"id": "dispatch-2", "name": "Dispatch - Session 2", "order": 2, "sub": 2, "use": "SEALED. Fully written - print, fold, seal. Opened only at the start signal. Countdown 85-90 min.", "when": "S2", "sheet": {"title": "MISSION 1 - KNOW YOUR GROUND", "sub": "DO NOT OPEN until the start signal.", "para": ["Walk the landmark loop around our own blocks and be back before the clock runs out. Five landmarks. Every turn is yours."], "fields": [["Scout", ""], ["Patrol", ""], ["Time out", ""], ["Time in", ""]], "bullets": ["Make every turn yourself. Nobody will tell you.", "Cross ONLY at lights or a marked crossing.", "At Bridgeview Trailhead you stay on the pavement. Nobody goes down the steps.", "The whole loop is about 1.4 miles, so keep moving between landmarks.", "Today nobody can fail. We are only writing down where you start."], "foot": "Countdown: 85-90 min.  Zero assists - no grown-up and no friend tells you anything. A Safety Stop never counts against you.", "table": {"cols": ["Stop", "Where I go", "What I do there", "My proof", "Done"], "rows": 0, "data": [["1", "The Line 18 stop, Park Blvd outside school", "Find it. This is the bus you will use all season, and the same line goes to Berkeley.", "Point at it and say the line number out loud", ""], ["2", "Monterey Redwoods, Monterey Blvd", "Stand under the tallest tree and look straight up.", "ONE photo of the redwoods", ""], ["3", "Bridgeview Trailhead, Bridgeview Trail", "Find the wooden trail sign. STAY AT THE TOP - do not go down the steps.", "ONE photo of the trail sign, taken from the pavement", ""], ["4", "Leimert Bridge, Leimert Blvd", "Stand on the bridge at the railing. It was built in 1926, high over a creek.", "ONE photo looking along the bridge", ""], ["5", "Corpus Christi Church, 322 St James Dr", "Find the square bell tower. This is the landmark you can see from the most streets.", "ONE photo of the bell tower", ""], ["6", "Back to school", "Return before the deadline.", "Write your time in", ""]]}}}, {"id": "p-landmarks", "name": "Session 2 Landmark Picture Cards", "order": 2, "sub": 3, "use": "Five landmarks within a 20-minute kid walk of school. Cut into cards for the Session 2 loop.", "when": "S2", "sheet": {"title": "LANDMARK CARDS - SESSION 2", "sub": "Every one of these is inside a 20-minute walk of school. Your guide picks which are on today's loop.", "landmarks": [{"svg": "<svg viewBox=\"0 0 120 90\" class=\"lmk\"><rect x=\"8\" y=\"60\" width=\"104\" height=\"26\" fill=\"#C6B48D\"/><rect x=\"52\" y=\"18\" width=\"7\" height=\"48\" fill=\"#5A6B60\"/><rect x=\"38\" y=\"8\" width=\"36\" height=\"22\" rx=\"4\" fill=\"#2F6F9E\"/><text x=\"56\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\" font-family=\"sans-serif\" font-weight=\"bold\">18</text><rect x=\"72\" y=\"40\" width=\"42\" height=\"24\" rx=\"5\" fill=\"#E8A33D\"/><circle cx=\"84\" cy=\"66\" r=\"6\" fill=\"#16382B\"/><circle cx=\"106\" cy=\"66\" r=\"6\" fill=\"#16382B\"/><rect x=\"78\" y=\"45\" width=\"12\" height=\"10\" fill=\"#DCE7F7\"/><rect x=\"94\" y=\"45\" width=\"12\" height=\"10\" fill=\"#DCE7F7\"/></svg>", "photo": "https://maps.googleapis.com/maps/api/streetview?size=440x330&location=37.818770,-122.210143&fov=80&pitch=6&source=outdoor", "name": "Our bus stop", "addr": "Park Blvd & Zion Lutheran Church & School", "walk": "at school", "what": "The Line 18 stop right outside school. This is the bus you take all season - and the same line goes all the way to Berkeley.", "look": "A blue-and-white AC Transit flag sign on a pole, on Park Blvd outside school."}, {"svg": "<svg viewBox=\"0 0 120 90\" class=\"lmk\"><rect x=\"8\" y=\"78\" width=\"104\" height=\"8\" fill=\"#C6B48D\"/><rect x=\"24\" y=\"40\" width=\"9\" height=\"38\" fill=\"#7A5A34\"/><polygon points=\"28.5,10 15,46 42,46\" fill=\"#3E7D4E\"/><rect x=\"52\" y=\"30\" width=\"9\" height=\"48\" fill=\"#7A5A34\"/><polygon points=\"56.5,0 43,36 70,36\" fill=\"#3E7D4E\"/><rect x=\"80\" y=\"46\" width=\"9\" height=\"32\" fill=\"#7A5A34\"/><polygon points=\"84.5,16 71,52 98,52\" fill=\"#3E7D4E\"/></svg>", "photo": "https://maps.googleapis.com/maps/api/streetview?size=440x330&location=37.817523,-122.205595&fov=80&pitch=6&source=outdoor", "name": "Monterey Redwoods", "addr": "Monterey Blvd, Oakland 94602", "walk": "0.30 mi  ·  about 12 min walk", "what": "A grove of enormous redwood trees, tucked into the hillside. Look up - they are some of the tallest things near school.", "look": "Very tall, straight, reddish-brown trunks in a tight group. Soft needles on the ground."}, {"svg": "<svg viewBox=\"0 0 120 90\" class=\"lmk\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"90\" fill=\"#EAF3ED\"/><path d=\"M10,86 C40,70 30,50 60,40 C90,30 84,16 112,8\" stroke=\"#C6B48D\" stroke-width=\"12\" fill=\"none\" stroke-linecap=\"round\"/><polygon points=\"18,52 4,74 32,74\" fill=\"#3E7D4E\"/><polygon points=\"100,44 88,64 112,64\" fill=\"#3E7D4E\"/><rect x=\"60\" y=\"18\" width=\"6\" height=\"34\" fill=\"#7A5A34\"/><rect x=\"48\" y=\"14\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#7A5A34\"/></svg>", "photo": "https://maps.googleapis.com/maps/api/streetview?size=440x330&location=37.813478,-122.211887&fov=80&pitch=6&source=outdoor", "name": "Bridgeview Trailhead", "addr": "Bridgeview Trail, Oakland 94602", "walk": "0.36 mi  ·  about 14 min walk", "what": "The entrance to the Dimond Canyon trail, where the creek runs below. Stairs lead down into the redwoods.", "look": "A wooden trail sign and steps heading downhill, at the end of a residential street."}, {"svg": "<svg viewBox=\"0 0 120 90\" class=\"lmk\"><rect x=\"8\" y=\"80\" width=\"104\" height=\"6\" fill=\"#C6B48D\"/><rect x=\"16\" y=\"44\" width=\"58\" height=\"36\" fill=\"#9AA3A8\"/><polygon points=\"45,26 12,46 78,46\" fill=\"#7C858A\"/><rect x=\"78\" y=\"24\" width=\"26\" height=\"56\" fill=\"#9AA3A8\"/><polygon points=\"91,6 76,26 106,26\" fill=\"#7C858A\"/><rect x=\"88\" y=\"0\" width=\"6\" heigh ph on hilly ground. Street View imagery can be a few years old - check each landmark still looks like its photo on your pre-walk."}}, {"id": "p-assist", "name": "Assist Log", "use": "Every expedition. One per scout, kept by their shadow.", "when": "S2 onward", "sheet": {"title": "ASSIST LOG", "sub": "One sheet per scout, per expedition. Scored against the route key.", "fields": [["Scout", ""], ["Date", ""], ["Session / Week", ""], ["Shadow adult", ""], ["Patrol", ""], ["Time out", ""], ["Time in", ""]], "table": {"cols": ["Decision point", "Independent", "Adult assist", "Peer assist", "Self-recovery", "What actually happened"], "rows": 8}, "tallies": ["Adult assists (against)", "Peer assists (against)", "Self-recoveries (for)", "Community Asks (for)", "Safety Stops (neutral)"], "foot": "A Safety Stop is neutral and never counts against the scout. Peer direction on a scored leg is logged exactly like adult help."}, "order": 2, "sub": 5}, {"id": "p-routekey", "name": "Decision-Point Route Key", "use": "Written by the guide BEFORE departure. The Assist Log is scored against it.", "when": "Every expedition", "sheet": {"title": "DECISION-POINT ROUTE KEY", "sub": "Pre-walked by a guide. Controlled crossings only. If a leg cannot yield 5 safe decision points, redesign the leg.", "fields": [["Mission", ""], ["Date", ""], ["Pre-walked by", ""], ["Reserve route", ""]], "table": {"cols": ["#", "Location", "The choice the scout faces", "Correct call", "Safe crossing?"], "rows": 8}, "foot": "Every scored leg contains exactly 5 pre-mapped decision points. Never lower the number to fit the terrain."}, "order": 2, "sub": 5}, {"id": "p-shadow", "name": "Silent Shadow Protocol Card", "use": "Hand to every adult before every mission. Pocket-sized.", "when": "Every expedition", "sheet": {"title": "SILENT SHADOW PROTOCOL", "sub": "Carry this. Read it before you leave.", "bullets": ["You are here for physical safety. Nothing else.", "Do NOT give a direction, a decision, a correction, a hint, or a time reminder.", "Do NOT confirm a choice. 'Yep, that way' is an assist.", "Do NOT read a sign or a price aloud.", "Say nothing at an obstacle. Log it. The scout photographs their own recovery.", "Intervene PHYSICALLY and immediately for traffic, a closing door, or crowd separation. That is a Safety Stop.", "A missed bus stop is NOT a Safety Stop. It is a navigation error the scout recovers from. Stay with them and say nothing.", "On a scored transit segment sit within arm's reach.", "With a solo patrol keep continuous line of sight, far enough not to coach.", "If you cannot stay silent, tell the lead guide now. You will be reassigned, not coached mid-mission."], "fields": [["Adult", ""], ["Patrol", ""], ["Lead guide phone", ""], ["Allergy / medical notes", ""]]}, "order": 2, "sub": 5}, {"id": "map-3", "name": "Map - Session 3: Planning room", "order": 3, "sub": 1, "use": "The map for Session 3. No walking today. You plan the route you will walk tomorrow.", "when": "S3", "sheet": {"title": "SESSION 3 MAP - PLANNING ROOM", "sub": "No walking today. You plan the route you will walk tomorrow.", "gmap": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=roadmap&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.831981,-122.214144&visible=37.818562,-122.210934%7C37.831981,-122.214144", "gbird": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=hybrid&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.831981,-122.214144&visible=37.818562,-122.210934%7C37.831981,-122.214144", "svg": "<svg viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"mapsvg\"><rect width=\"640\" height=\"400\" fill=\"#F3EADA\" stroke=\"#16382B\" stroke-width=\"3\" rx=\"8\"/><line x1=\"148\" y1=\"50\" x2=\"148\" y2=\"350\" stroke=\"#C6B48D\" stroke-width=\"1\"/><line x1=\"234\" y1=\"50\" x2=\"234\" y2=\"350\" stroke=\"#C6B48D\" stroke-w  scout who will not approach a helper.", "Role-play three counters in a row - librarian, shop worker, driver. Greet, one question, thank you. Then one real ask that day."], ["STATION 5 - The proof", "For a scout who loses evidence.", "Empty Proof Pack, six objects on a table. Collect, label, and code all six in four minutes."], ["STATION 6 - The peer pull", "For a scout who tells patrol-mates the answer.", "Run a silent leg. The scout may point at their OWN map only. Debrief: what did it cost your friend when you told them?"]], "foot": "Coaching matched to the gap - modelling if they do not know what good looks like, fading if they can do it with hints, deep practice if they were fine until the twist."}, "order": 11, "sub": 5}, {"id": "map-12", "name": "Map - Session 12: The Real Errand", "order": 12, "sub": 1, "use": "The map for Session 12. Checkpoint 2. Scored transit, solo stretch, real errand, real deadline.", "when": "S12", "sheet": {"title": "SESSION 12 MAP - THE REAL ERRAND", "sub": "Checkpoint 2. Scored transit, solo stretch, real errand, real deadline.", "gmap": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=roadmap&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&markers=color:0xE4572E%7Clabel:3%7C37.807102,-122.222478&visible=37.818562,-122.210934%7C37.818770,-122.210143%7C37.807102,-122.222478", "gbird": "https://maps.googleapis.com/maps/api/staticmap?size=640x400&scale=2&maptype=hybrid&markers=color:0x16382B%7Clabel:1%7C37.818562,-122.210934&markers=color:0xE4572E%7Clabel:2%7C37.818770,-122.210143&markers=color:0xE4572E%7Clabel:3%7C37.807102,-122.222478&visible=37.818562,-122.210934%7C37.818770,-122.210143%7C37.807102,-122.222478", "svg": "<svg viewBox=\"0 0 640 400\" xmlns=\"http://www.w3.org/2000/svg\" class=\"mapsvg\"><rect width=\"640\" height=\"400\" fill=\"#F3EADA\" stroke=\"#16382B\" stroke-width=\"3\" rx=\"8\"/><line x1=\"148\" y1=\"50\" x2=\"148\" y2 <script>
const D = window.__DATA__;

/* ============================================================
   GOOGLE MAPS API KEY  -  paste yours between the quotes below.
   It powers two things: the Google map on every session map sheet,
   and the real Street View photo on every landmark card.
   Without a key those fall back to a drawn schematic, and the site
   still works. See the README for how to get a key (free tier is
   ample for a workshop this size).
   ============================================================ */
const GMAPS_KEY = "";

const hasKey = () => GMAPS_KEY.trim().length > 0;
const gurl = base => base + "&key=" + encodeURIComponent(GMAPS_KEY.trim());
let VOICE = null, VOICES = [];

/* ---------- speech: rank voices, split sentences, vary delivery ---------- */
function scoreVoice(v){
  const n = (v.name||'').toLowerCase();
  let s = 0;
  if(!/^en(-|_|$)/i.test(v.lang||'')) s -= 60;
  if(/natural|neural|enhanced|premium|siri/.test(n)) s += 50;
  if(/google/.test(n)) s += 30;
  if(/microsoft/.test(n)) s += 12;
  if(/aria|jenny|guy|ava|zoe|evan|samantha|serena|allison/.test(n)) s += 14;
  if(/compact|espeak|festival|pico|novelty|zarvox|albert|bad news|bells|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble/.test(n)) s -= 45;
  if(/^en-us/i.test(v.lang||'')) s += 6;
  if(v.localService) s += 4;
  return s;
}
function loadVoices(){
  const all = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  if(!all.length) return;
  VOICES = all.filter(v=>/^en/i.test(v.lang||'')).sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  if(!VOICES.length) VOICES = all.slice();
  if(!VOICE) VOICE = VOICES[0];
  const sel = document.getElementById('voiceSel');
  if(sel){
    sel.innerHTML = VOICES.map((v,i)=>`<option value="${i}">${v.name.replace(/\s*\(.*?\)\s*/g,' ').trim()}</option>`).join('');
    sel.value = Math.max(0, VOICES.indexOf(VOICE));
  }
}
function splitSentences(t){
  return t.replace(/\s+/g,' ').split(/(?<=[.!?:])\s+/).filter(x=>x.trim().length);
}
let chain = [];
function stopSpeech(){
  chain = [];
  if(window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.hear.playing').forEach(b=>b.classList.remove('playing'));
}
function speak(text, btn){
  if(!window.speechSynthesis){ alert("This browser can't read aloud. Try Chrome, Edge or Safari."); return; }
  const again = btn && btn.classList.contains('playing');
  stopSpeech();
  if(again) return;
  if(btn) btn.classList.add('playing');
  const parts = splitSentences(text);
  let i = 0;
  const next = () => {
    if(i >= parts.length){ if(btn) btn.classList.remove('playing'); return; }
    const s = parts[i++];
    const u = new SpeechSynthesisUtterance(s);
    if(VOICE) u.voice = VOICE;
    u.lang = (VOICE && VOICE.lang) || 'en-US';
    const isQ = /\?$/.test(s.trim());
    const warn = /never|not allowed|do not|don't|no help|stop|safety|danger|only/i.test(s);
    u.pitch = isQ ? 1.18 : 1.0;
    u.rate  = warn ? 0.82 : 0.94;          // slow for warnings, calm elsewhere
    u.volume = 1;
    u.onend = () => setTimeout(next, isQ ? 420 : 300);   // real pauses between sentences
    u.onerror = () => { if(btn) btn.classList.remove('playing'); };
    speechSynthesis.speak(u);
  };
  next();
}
function hearBtn(text, big){
  const id = 'h' + (hearBtn.n = (hearBtn.n||0)+1);
  window['__t'+id] = text;
  return `<button class="hear${big?' big':''}" data-say="${id}" aria-label="Hear it read aloud">🔊 Hear it</button>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('.hear');
  if(b){ speak(window['__t'+b.dataset.say] || '', b); return; }
  const g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); go(g.getAttribute('data-go')); return; }
  const a = e.target.closest('a[href^="#"]');
  if(a){ e.preventDefault(); go(a.getAttribute('href').slice(1)); }
});

/* ---------- page model ---------- */
const PAGES = [];
const GROUPS = [];
function addGroup(label, items){ GROUPS.push({label, items}); items.forEach(p=>PAGES.push(p)); }

addGroup('Start here', D.start.map(p=>({...p, kind:'content'})));
for(let w=1; w<=8; w++){
  const ss = D.sessions.filter(s=>s.week===w && s.kind!=='showcase');
  const items = [];
  ss.forEach(s=>{
    items.push({id:`s${s.n}-plan`, kicker:`${s.label} · ${s.when}`, title:"Today's plan", nav:`${s.label} plan`, kind:'plan', s});
    items.push({id:`s${s.n}-do`,   kicker:`${s.label} · ${s.when}`, title:s.name, nav:s.name, kind:'do', s});
  });
  addGroup(`Week ${w}`, items);
}
addGroup('The Big Test', D.test.map(p=>({...p, kind:'content'})));
const SHOW = D.sessions.filter(s=>s.kind==='showcase');
addGroup('Showcase', SHOW.flatMap(s=>[
  {id:`s${s.n}-plan`, kicker:'Showcase · after Week 8', title:"Showcase plan", nav:'Showcase plan', kind:'plan', s},
  {id:`s${s.n}-do`,   kicker:'Showcase · after Week 8', title:s.name, nav:s.name, kind:'do', s}
]));
addGroup('Guide Corner', D.guide.map(p=>({...p, kind:'content'})));
addGroup('Printables', [{id:'printables', kicker:'Printables', title:'All printables', nav:'All printables', kind:'plist'}]);
D.printables.forEach(p=>PAGES.push({id:p.id, kicker:'Printable', title:p.name, kind:'sheet', p}));

const idx = id => PAGES.findIndex(p=>p.id===id);

/* ---------- renderers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function stepsHTML(name, mins, steps){
  const all = steps.map(s=>s.t).join(' ');
  return `<div class="card"><div class="blockhead">
      <h3>${esc(name)}</h3>${mins?`<span class="mins">${esc(mins)}</span>`:''}
      ${hearBtn((name+'. ')+all, true)}</div>
    <ul class="steps">${steps.map(s=>`<li><span class="ic" aria-hidden="true">${s.i}</span>
      <span class="stxt">${esc(s.t)}</span>${hearBtn(s.t)}</li>`).join('')}</ul></div>`;
}
function renderPlan(s){
  const total = s.blocks.map(b=>`${b.n} — ${b.m}`).join('. ');
  let h = `<div class="ican"><div class="lb">By the end of today</div><p>${esc(s.ican)}</p></div>`;
  h += `<div class="card"><div class="blockhead"><h3>What we do today</h3>
        ${hearBtn('Today we do these. ' + total, true)}</div>`;
  s.blocks.forEach(b=>{ h += `<div class="planrow"><span class="nm">${esc(b.n)}</span>
        <span class="mins">${esc(b.m)}</span></div>`; });
  h += `<div class="total"><span>Whole session</span><span class="mins">${esc(s.total)}</span></div></div>`;
  h += `<div class="expect">${esc(s.expect)} ${hearBtn(s.expect)}</div>`;
  if(s.res) h += `<div class="call pine"><h4>What we bring</h4><p>${esc(s.res.replace(/·/g,'•'))}</p></div>`;
  return h;
}
function renderDo(s){
  let h = '';
  if(s.kind === 'expedition'){
    h += `<div class="call blaze"><h4>⚠️ Safety, every time</h4>
      <p>Cross ONLY at lights or a marked crossing. Stay where your shadow can see you.
      Only talk to helpers we agreed on. Your shadow keeps you safe — they never tell you the way.</p>
      ${hearBtn('Safety, every time. Cross only at lights or a marked crossing. Stay where your shadow can see you. Only talk to helpers we agreed on. Your shadow keeps you safe. They never tell you the way.')}</div>`;
  }
  s.blocks.forEach(b=>{ h += stepsHTML(b.n, b.m, b.steps); });
  return h;
}
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.t==='lead') return `<p class="lead">${esc(b.text)} ${hearBtn(b.text)}</p>`;
    if(b.t==='steps') return stepsHTML(b.n, b.m, b.steps);
    if(b.t==='call') return `<div class="call ${b.style}"><h4>${esc(b.title)}</h4>
      ${b.lines.map(l=>`<p>${esc(l)}</p>`).join('')}${hearBtn(b.title+'. '+b.lines.join(' '))}</div>`;
    if(b.t==='grid') return `<div class="grid">${b.items.map(i=>`<div class="gi">
      <div class="gh"><span aria-hidden="true">${i.i}</span><span>${esc(i.h)}</span></div>
      <p>${esc(i.p)}</p>${hearBtn(i.h+'. '+i.p)}</div>`).join('')}</div>`;
    if(b.t==='two') return `<div class="two">
      <div><h4><span aria-hidden="true">${b.left.i}</span>${esc(b.left.h)}</h4><ul>${b.left.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${hearBtn(b.left.h+'. '+b.left.items.join('. '))}</div>
      <div><h4><span aria-hidden="true">${b.right.i}</span>${esc(b.right.h)}</h4><ul>${b.right.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
        ${hearBtn(b.right.h+'. '+b.right.items.join('. '))}</div></div>`;
    if(b.t==='moves'){
      const M=[['1','STOP and LOOK','My map. The signs. What I can see.'],
               ['2','PICK ONE and TRY','Think of 2 ways. Choose one. Go.'],
               ['3','ASK A HELPER','Never my shadow grown-up.']];
      return M.map(m=>`<div class="mv"><div class="n">${m[0]}</div><div><h4>${m[1]}</h4><p>${m[2]}</p>
        ${hearBtn('Move '+m[0]+'. '+m[1]+'. '+m[2])}</div></div>`).join('');
    }
    if(b.t==='counts'){
      const C=[['no','🚫','A grown-up tells me what to do.','HURTS ME'],
               ['no','🚫','A friend tells me the answer.','HURTS ME'],
               ['yes','✅','I got stuck and I fixed it myself.','HELPS ME'],
               ['yes','✅','I asked a helper my own question.','HELPS ME']];
      return C.map(c=>`<div class="cnt ${c[0]}"><span class="m" aria-hidden="true">${c[1]}</span>
        <span class="t">${c[2]}</span><span class="v">${c[3]}</span>${hearBtn(c[2]+' That '+c[3].toLowerCase())}</div>`).join('');
    }
    if(b.t==='ladder'){
      const L=[['CADET','S2 · Week 1','Finished my first mission. My starting number is written down.'],
               ['SCOUT','S4 · Week 2','Planned my own route and found my book by its number.'],
               ['PATHFINDER','S6 · Week 3','Something went wrong and I fixed it myself. 2 or fewer grown-up helps.'],
               ['TRAILBLAZER','S12 · Week 6','A real errand with no help at all, one helper question, every proof, back on time.'],
               ['ALPHA EXPLORER','S16 · Week 8','Passed the Big Test. This one cannot be bought.']];
      return `<div class="ladder">${L.map((r,i)=>`<div class="rung${i===L.length-1?' top':''}">
        <div class="rail"><div class="mark">${i===L.length-1?'★':i+1}</div><div class="line"></div></div>
        <div class="rbody"><h4>${r[0]}</h4><div class="w">${r[1]}</div><p>${r[2]}</p>
        ${hearBtn(r[0]+'. Earned at '+r[1]+'. '+r[2])}</div></div>`).reverse().join('')}</div>`;
    }
    if(b.t==='chain'){
      const S=[['Downtown Berkeley BART','2160 Shattuck Ave','The coach drops you here. Open the envelope.','No proof — this is the start'],
               ['The Eucalyptus Grove','Hilgard Way','Tall trees with a strong smell.','ONE fallen leaf in your bag'],
               ['Valley Life Sciences Building','Harmon Way','The biggest building on campus. There is a T. rex inside.','TWO facts copied off the dinosaur label'],
               ['Cal Student Store','2495 Bancroft Way','Buy your thing. Ask the person at the counter your question.','Your RECEIPT — this is the big one'],
               ['Sather Gate','Sather Rd','The famous old gate.','A pencil RUBBING of the letters'],
               ['The Campanile','Sather Tower','The tall tower. Your last stop.','The TIME on the clock face']];
      return `<div class="chain">${S.map((s,i)=>`<div class="stop"><div class="sn">${i+1}</div><div>
        <h4>${s[0]}</h4><div class="meta">${s[1]}</div><p>${s[2]}</p>
        <p class="pr"><b>My proof:</b> ${s[3]}</p>${hearBtn('Stop '+(i+1)+'. '+s[0]+'. '+s[2]+' My proof: '+s[3])}</div></div>`).join('')}</div>`;
    }
    if(b.t==='qa'){
      return D.qa.map(q=>`<div class="qa"><div class="s">Session ${q[0]}</div>
        <div class="q">${esc(q[1])}</div><div class="t">${esc(q[2])}</div></div>`).join('');
    }
    if(b.t==='voices'){
      return `<table class="vtab"><thead><tr><th>Device</th><th>Install a natural voice</th></tr></thead><tbody>
        ${D.voices.map(v=>`<tr><td>${esc(v[0])}</td><td>${esc(v[1])}</td></tr>`).join('')}</tbody></table>`;
    }
    return '';
  }).join('');
}
function renderSheet(p){
  const s = p.sheet;
  let h = `<button class="btn pri" id="printBtn" onclick="printSheet('${p.id}')">🖨️ Print this sheet</button>`;
  h += `<div class="sheet" id="sheet-${p.id}"><h3>${esc(s.title)}</h3><div class="sub">${esc(s.sub||'')}</div>`;
  if(s.para) h += `<div class="para">${s.para.map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;
  if(s.fields) h += s.fields.map(f=>`<div class="frow"><span class="fl">${esc(f[0])}</span><span class="fr"></span></div>`).join('');
  if(s.big) h += s.big.map(b=>`<div class="bigrow"><div class="bn">${esc(b[0])}</div><div><h5>${esc(b[1])}</h5><p>${esc(b[2])}</p></div></div>`).join('');
  if(s.photomap){
    h += `<figure class="photomap">
      <div class="pmwrap"><img src="${s.photomap.src}" alt="Map of the Session 2 landmark loop">
        ${s.photomap.pins.map(p=>`<span class="pin${p.n==='S'?' start':''}${p.side==='left'?' lft':''}${p.side==='below'?' dn':''}" style="left:${p.x}%;top:${p.y}%">
           <b>${esc(p.n)}</b><i>${esc(p.label)}</i></span>`).join('')}</div>
      <figcaption>${esc(s.photomap.credit || "Map data \u00a92026 Google")}</figcaption></figure>`;
  } else if(s.gmap && hasKey()){
    h += `<div class="mapgrid">
      <figure class="gm"><img src="${gurl(s.gmap)}" alt="Google map of this session's places" loading="lazy">
        <figcaption>Map view &middot; Map data &copy;2026 Google</figcaption></figure>
      <figure class="gm"><img src="${gurl(s.gbird)}" alt="Bird view of this session's places" loading="lazy">
        <figcaption>Bird view &middot; Imagery &copy;2026 Google</figcaption></figure></div>`;
  } else if(s.gmap){
    h += `<div class="mapwrap">${s.svg}</div>`;
  } else if(s.svg){ h += `<div class="mapwrap">${s.svg}</div>`; }
  if(s.landmarks) h += `<div class="lmks">${s.landmarks.map((L,i)=>`<div class="lmkcard">
      <div class="lmkimg">${(L.photo && hasKey())
          ? `<img class="lmkphotoimg" src="${gurl(L.photo)}" alt="Street View photo of ${esc(L.name)}" loading="lazy">`
          : L.svg}<span class="lmkno">${i+1}</span></div>
      <div class="lmkbody"><h5>${esc(L.name)}</h5>
        <div class="lmkmeta">${esc(L.addr)}</div>
        <div class="lmkwalk">${esc(L.walk)}</div>
        <p>${esc(L.what)}</p>
        <p class="lmklook"><b>Look for:</b> ${esc(L.look)}</p>
        ${(L.photo && hasKey()) ? '' : '<div class="lmkphoto">Street View photo appears here once a key is added</div>'}
        </div></div>`).join('')}</div>`;
  if(s.table){
    h += `<table class="sh"><thead><tr>${s.table.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>`;
    if(s.table.data) h += s.table.data.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    for(let i=0;i<(s.table.rows||0);i++) h += `<tr>${s.table.cols.map(()=>'<td></td>').join('')}</tr>`;
    h += `</tbody></table>`;
  }
  if(s.tallies) h += `<table class="sh"><thead><tr><th>Tally</th><th>Count</th></tr></thead><tbody>${
      s.tallies.map(t=>`<tr><td>${esc(t)}</td><td></td></tr>`).join('')}</tbody></table>`;
  if(s.cards) h += `<div class="cards2">${s.cards.map(c=>`<div class="pcard"><h5>${esc(c[0])}</h5>
      <p>${esc(c[1])}</p>${c[2]?`<p class="win">Success: ${esc(c[2])}</p>`:''}</div>`).join('')}</div>`;
  if(s.checks) h += `<ul class="ck">${s.checks.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`;
  if(s.bullets) h += `<ul class="bl">${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;
  if(s.stamp) h += `<div class="stampbox"><div>PASS</div><div>NOT YET</div></div>`;
  if(s.foot) h += `<div class="foot">${esc(s.foot)}</div>`;
  h += `</div>`;
  return h;
}
function renderPlist(){
  return `<div class="plist">${D.printables.map(p=>`<a class="pitem" href="#${p.id}">
    <span class="pn"><h4>${esc(p.name)}</h4><p>${esc(p.use)}</p></span>
    <span class="wh">${esc(p.when)}</span></a>`).join('')}</div>`;
}

/* ---------- print in a new window (window.print is ignored in sandboxed iframes) ---------- */
function printSheet(id){
  const el = document.getElementById('sheet-'+id);
  if(!el) return;
  const css = document.getElementById('appcss').textContent;
  const w = window.open('', '_blank');
  if(!w){ alert("Your browser blocked the print window. Allow pop-ups for this site, then tap Print this sheet again."); return; }
  w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${document.title}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
    <style>${css}
      body{background:#fff;padding:26px;font-size:15px}
      body::before{display:none}
      .sheet{box-shadow:none;border:2px solid #16382B}
      .bar{position:sticky;top:0;background:#E9DCC0;border:2px solid #16382B;border-radius:9px;
           padding:10px 14px;margin-bottom:18px;display:flex;gap:14px;align-items:center;
           font-family:'Baloo 2',sans-serif}
      @media print{.bar{display:none}.sheet{border:0;padding:0}}
    </style></head><body>
    <div class="bar"><button class="btn pri" onclick="window.print()">🖨️ Print</button>
      <span>or press <b>Ctrl + P</b> (<b>⌘ + P</b> on Mac)</span></div>
    ${el.outerHTML}</body></html>`);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); }catch(e){} }, 250);
}

/* ---------- shell render ---------- */
function buildNav(){
  const cur = CUR;
  document.getElementById('nav').innerHTML = GROUPS.map(g=>
    `<div class="grp">${g.label}</div>` + g.items.map(p=>{
      const n = p.s ? 'S'+p.s.n : '';
      return `<a href="#${p.id}" class="${p.id===cur?'on':''}"><span class="num">${n}</span>
        <span>${esc(p.nav || p.title)}</span></a>`;
    }).join('')).join('');
}
function buildBlaze(i){
  const total = PAGES.length;
  const miles = new Set([idx('s2-do'), idx('s4-do'), idx('s6-do'), idx('s12-do'), idx('s16-do')]);
  let h = '';
  for(let k=0;k<total;k++){
    const cls = ['bz', miles.has(k)?'mile':'', k<i?'done':'', k===i?'now':''].filter(Boolean).join(' ');
    h += `<span class="${cls}"></span>`;
  }
  const p = PAGES[i];
  h += `<span class="lab">${i+1} / ${total}${p.s?' · '+p.s.label:''}</span>`;
  document.getElementById('blaze').innerHTML = h;
}
let CUR = PAGES[0].id;
let URLSYNC = true;   // the address bar is a write-only mirror; routing never reads it after load
function go(id){
  if(idx(id) < 0) return;
  CUR = id;
  render();
  if(URLSYNC){
    // sandboxed iframes and rapid navigation both make history writes throw or throttle.
    // If one fails we stop syncing for good rather than let the URL drive the router.
    try{ history.replaceState(null, '', '#' + id); }
    catch(e){ URLSYNC = false; }
  }
  if(window.innerWidth <= 900) document.body.classList.remove('navopen');
}
function render(){
  stopSpeech();
  let i = idx(CUR);
  if(i < 0){ i = 0; CUR = PAGES[0].id; }
  const p = PAGES[i];
  let body = '';
  if(p.kind === 'plan')  body = renderPlan(p.s);
  else if(p.kind === 'do')    body = renderDo(p.s);
  else if(p.kind === 'sheet') body = renderSheet(p.p);
  else if(p.kind === 'plist') body = `<p class="lead">Every sheet this workshop needs. Each one opens its own printable page.</p>` + renderPlist();
  else body = renderBlocks(p.blocks);

  const flag = p.s && p.s.flag ? `<span class="flag${/BASELINE|SHOWCASE/.test(p.s.flag)?' grey':''}">${p.s.flag}</span>` : '';
  const head = `<div class="kicker">${esc(p.kicker||'')}</div>${flag}
    <h2 class="title">${esc(p.title)}</h2>
    ${p.s?`<div class="when">${esc(p.s.label)} · ${esc(p.s.when)} · ${esc(p.s.total)}</div>`:''}`;
  const prev = PAGES[i-1], next = PAGES[i+1];
  const pager = `<div class="pager">
    ${prev?`<button class="btn" data-go="${prev.id}">← ${esc((prev.nav||prev.title).slice(0,34))}</button>`:'<span></span>'}
    ${next?`<button class="btn pri" data-go="${next.id}">${esc((next.nav||next.title).slice(0,34))} →</button>`:'<span></span>'}
  </div>`;
  document.getElementById('page').innerHTML = head + body + pager;
  window.scrollTo(0,0);
  document.querySelector('.main').scrollTop = 0;
  document.title = p.title + ' · Alpha Scouts';
  buildNav(); buildBlaze(i);
  document.body.classList.remove('navopen');
}
// No hashchange/popstate routing on purpose: a queued URL event can arrive after a
// newer go() and drag the reader back a page. Deep links are read once, on load.

/* keyboard + swipe */
document.addEventListener('keydown', e => {
  if(/input|select|textarea/i.test(e.target.tagName)) return;
  const i = Math.max(0, idx(CUR));
  if(e.key === 'ArrowRight' && PAGES[i+1]) go(PAGES[i+1].id);
  if(e.key === 'ArrowLeft'  && PAGES[i-1]) go(PAGES[i-1].id);
  if(e.key === 'Escape') stopSpeech();
});
let tx = 0, ty = 0;
document.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
  const i = Math.max(0, idx(CUR));
  if(dx < 0 && PAGES[i+1]) go(PAGES[i+1].id);
  if(dx > 0 && PAGES[i-1]) go(PAGES[i-1].id);
}, {passive:true});

function togglePresent(){
  document.body.classList.toggle('present');
  if(document.body.classList.contains('present')){
    if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  } else if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange', ()=>{
  if(!document.fullscreenElement) document.body.classList.remove('present');
});

if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 550);
}
document.getElementById('voiceSel').addEventListener('change', e => { VOICE = VOICES[+e.target.value]; });
document.getElementById('voiceTest').addEventListener('click', () => speak('My three moves. Stop and look. Pick one and try. Ask a helper.'));
function toggleNav(){
  if(window.innerWidth <= 900) document.body.classList.toggle('navopen');
  else document.body.classList.toggle('navclosed');
}
document.getElementById('burger').addEventListener('click', toggleNav);
document.getElementById('navclose').addEventListener('click', toggleNav);
document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('navopen'));
document.getElementById('present').addEventListener('click', togglePresent);
try{ const h = location.hash.slice(1); if(h && idx(h) >= 0) CUR = h; }catch(e){}
render();
</script>
